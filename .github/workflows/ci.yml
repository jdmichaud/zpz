name: ci
on:
  pull_request:
  push:
    branches:
      - '**'
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        target: [ x86_64-linux ]
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup Zig
      uses: mlugg/setup-zig@v2
      with:
        version: 0.14.1

    - name: Init submodules
      run: |
        git submodule init
        git submodule update

    - name: Install OS dependencies
      run: |
        set -ex
        sudo apt-get update
        sudo apt-get install -y libsdl2-dev

    - name: Build
      # Need to find a way to specify where to find the correct SDL when cross building
      # https://github.com/ziglang/zig/issues/17384
      # run: zig build -Doptimize=ReleaseSafe -Dtarget=${{ matrix.target }}
      run: zig build -Doptimize=ReleaseSafe

    - name: Archive executable
      uses: actions/upload-artifact@v7
      with:
        # upload-artifact v4 and later reject two uploads sharing a name, so
        # keep it unique per matrix entry.
        name: zpz-${{ matrix.target }}
        path: zig-out/bin/*
